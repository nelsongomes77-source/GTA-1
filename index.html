<p>A abrir a app… <br><a href="gta-v2.html">Toca aqui se não abrir</a></p>
<script>
/* Esta página só encaminha para a app (gta-v2.html).
   Na primeira vez neste telemóvel, apaga a cópia antiga guardada para não aparecer a versão velha. */
(async function () {
    try {
        if (!localStorage.getItem('gta_clean_v5')) {
            if ('serviceWorker' in navigator) {
                var regs = await navigator.serviceWorker.getRegistrations();
                await Promise.all(regs.map(function (r) { return r.unregister(); }));
            }
            if (window.caches) {
                var ks = await caches.keys();
                await Promise.all(ks.map(function (k) { return caches.delete(k); }));
            }
            localStorage.setItem('gta_clean_v5', '1');
        }
    } catch (e) {}
    location.replace('gta-v2.html' + location.search + location.hash);
})();
</script></body></html>
