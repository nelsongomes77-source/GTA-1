<!doctype html>
<html lang="pt-PT"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atualizar GTA</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0a1520;color:#e6f7ff;font-family:system-ui,sans-serif;text-align:center;padding:24px}
.box{max-width:340px}h1{font-size:1.3rem;margin:0 0 12px}p{color:#8fa6c8;line-height:1.5}
a{display:inline-block;margin-top:14px;padding:10px 16px;border-radius:20px;border:1px solid #4dd0ff;color:#e6f7ff;text-decoration:none}
</style></head><body><div class="box">
<h1>🔄 A atualizar a app…</h1>
<p id="msg">A limpar a cópia antiga guardada neste telemóvel.</p>
<a id="go" href="index.html" style="display:none">Abrir a app</a>
</div>
<script>
(async function () {
    var msg = document.getElementById('msg'), go = document.getElementById('go');
    try {
        if ('serviceWorker' in navigator) {
            var regs = await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.map(function (r) { return r.unregister(); }));
        }
        if (window.caches) {
            var ks = await caches.keys();
            await Promise.all(ks.map(function (k) { return caches.delete(k); }));
        }
        msg.textContent = 'Cópia antiga removida ✔ A abrir a versão nova…';
    } catch (e) {
        msg.textContent = 'Não foi possível limpar tudo. Toca no botão para abrir a app.';
        go.style.display = 'inline-block';
        return;
    }
    go.style.display = 'inline-block';
    setTimeout(function () { location.replace('index.html?v=' + Date.now()); }, 1200);
})();
</script></body></html>
